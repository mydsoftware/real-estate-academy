name: Finalize Academy Extras

on:
  push:
    paths:
      - '.github/workflows/finalize-extras.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add academy dashboard and exams
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/main.jsx')
          s=p.read_text(encoding='utf-8')
          if 'FINAL_ACADEMY_EXTRAS_V1' not in s:
            marker='function App(){'
            component=r'''
/* FINAL_ACADEMY_EXTRAS_V1 */
function AcademyExtras(){
  const [done,setDone]=React.useState(()=>{try{return JSON.parse(localStorage.getItem('reAcademyDone')||'[]')}catch{return []}});
  const [exam,setExam]=React.useState(null);
  const [answers,setAnswers]=React.useState({});
  const [submitted,setSubmitted]=React.useState(false);
  const [scenario,setScenario]=React.useState(0);
  React.useEffect(()=>{const on=()=>{try{setDone(JSON.parse(localStorage.getItem('reAcademyDone')||'[]'))}catch{}};window.addEventListener('storage',on);return()=>window.removeEventListener('storage',on)},[]);
  const moduleLessons=(m)=>m.lessons.map((l,i)=>({title:l[0],text:l[1],key:`${m.id}-${i}`}));
  const makeExam=(title,lessons,final=false)=>{
    const pool=lessons.flatMap(l=>[{q:`کدام گزینه به‌طور مستقیم با «${l.title}» مرتبط است؟`,a:l.text}, {q:`هدف عملی درس «${l.title}» چیست؟`,a:l.text}]);
    const qs=[]; for(let i=0;i<(final?20:10);i++){const item=pool[i%pool.length];const others=pool.filter((_,j)=>j!==i).slice(0,3).map(x=>x.a);const opts=[item.a,...others];const shift=(i*2)%4;const ro=opts.slice(shift).concat(opts.slice(0,shift));qs.push({q:item.q,o:ro,c:ro.indexOf(item.a)})} return {title,qs};
  };
  const start=(title,lessons,final=false)=>{setExam(makeExam(title,lessons,final));setAnswers({});setSubmitted(false);window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})};
  const submit=()=>setSubmitted(true);
  const score=exam?Math.round(exam.qs.reduce((n,q,i)=>n+(answers[i]===q.c?1:0),0)/exam.qs.length*100):0;
  const reset=()=>{if(confirm('پیشرفت و نمرات محلی پاک شوند؟')){localStorage.removeItem('reAcademyDone');Object.keys(localStorage).filter(k=>k.startsWith('reAcademyQuiz:')).forEach(k=>localStorage.removeItem(k));setDone([])}};
  const scenarios=[
    ['مالک می‌گوید: «قیمت من قطعی است و اصلاً تخفیف ندارم.»','به‌جای جدل، مبنای قیمت، شرایط و نمونه‌های قابل مقایسه را بررسی و ثبت کن.'],
    ['خریدار فقط می‌گوید: «هرچه ارزان‌تر بهتر.»','نیازسنجی کن و بودجه، محدوده و معیارهای حذف‌کننده را مشخص کن.'],
    ['در بازدید، ترک و نم مشکوک می‌بینی.','مشاهده را دقیق ثبت کن و برای علت فنی، بررسی متخصص را پیشنهاد بده؛ تشخیص قطعی نده.'],
    ['نماینده‌ای برای فروش آمده اما حدود اختیارش روشن نیست.','پیش از تعهد جدی، هویت، سمت و حدود اختیار را از مسیر معتبر بررسی کن.']
  ];
  return <section className="academyExtras">
    <div className="extraHead"><div><span className="eyebrow">مرکز ارزیابی</span><h2>داشبورد و آزمون‌های آکادمی</h2><p>پیشرفت، آزمون‌های ماژولی، آزمون نهایی و تمرین سناریویی در یکجا.</p></div><button onClick={reset}>بازنشانی پیشرفت</button></div>
    <div className="extraStats"><div><b>{done.length}</b><span>درس تکمیل‌شده</span></div><div><b>{allLessons.length}</b><span>درس کل</span></div><div><b>{Math.round(done.length/allLessons.length*100)}%</b><span>پیشرفت</span></div><div><b>{modules.length}</b><span>ماژول</span></div></div>
    <div className="examGrid">{modules.map(m=><article className="examCard" key={m.id}><span>{m.title}</span><strong>{m.lessons.length} درس</strong><button onClick={()=>start(`آزمون ماژول: ${m.title}`,moduleLessons(m))}>آزمون ۱۰ سؤالی</button></article>)}<article className="examCard finalExam"><span>آزمون نهایی آکادمی</span><strong>۲۰ سؤال ترکیبی</strong><button onClick={()=>start('آزمون نهایی آکادمی',allLessons,true)}>شروع آزمون نهایی</button></article></div>
    <div className="scenarioCard"><div><span className="quizEyebrow">شبیه‌ساز تصمیم‌گیری</span><h3>اگر جای مشاور بودی چه می‌کردی؟</h3><p>{scenarios[scenario][0]}</p></div><div className="scenarioAnswer"><button onClick={()=>setScenario((scenario+1)%scenarios.length)}>نمایش رویکرد حرفه‌ای</button><p>{scenarios[scenario][1]}</p></div></div>
    {exam&&<div className="examOverlay"><div className="examModal"><button className="close" onClick={()=>setExam(null)}>×</button><span className="eyebrow">{exam.title}</span><h2>{exam.title}</h2><p>برای ثبت نتیجه، به همه سؤال‌ها پاسخ بده.</p>{exam.qs.map((q,i)=><div className="finalQuestion" key={i}><b>{i+1}. {q.q}</b>{q.o.map((o,j)=><label key={j} className={submitted?(j===q.c?'quizCorrect':answers[i]===j?'quizWrong':''):''}><input type="radio" name={`final-${i}`} disabled={submitted} checked={answers[i]===j} onChange={()=>setAnswers(a=>({...a,[i]:j}))}/><span>{o}</span></label>)}{submitted&&<small>{answers[i]===q.c?'✓ درست':'✗ پاسخ صحیح: '+q.o[q.c]}</small>}</div>)}{!submitted?<button className="quizSubmit" disabled={Object.keys(answers).length!==exam.qs.length} onClick={submit}>ثبت آزمون</button>:<div className="quizResult"><strong>نمره: {score}%</strong><span>{score>=70?'قبول شدی':'نیاز به مرور دوباره داری'}</span><button onClick={()=>{setAnswers({});setSubmitted(false)}}>آزمون مجدد</button></div>}</div></div>}
  </section>;
}

'''
            s=s.replace(marker,component+marker,1)
            needle='<section className="field">'
            s=s.replace(needle,'<AcademyExtras/>\n        '+needle,1)
            p.write_text(s,encoding='utf-8')
      - name: Add extras styles
        run: |
          cat >> src/styles.css <<'CSS'
/* FINAL_ACADEMY_EXTRAS_V1 */
.academyExtras{margin-top:28px}.extraHead{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:15px}.extraHead h2{margin:6px 0;font-size:21px;color:#173f36}.extraHead p{margin:0;font-size:11px;color:#707a74}.extraHead button{background:#fff;border:1px solid #d9dfda;border-radius:9px;padding:9px 12px;font-size:10px;color:#6a4f25}.extraStats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:15px}.extraStats div{background:#fff;border:1px solid #e2e7e1;border-radius:13px;padding:14px}.extraStats b{display:block;font-size:20px;color:#173f36}.extraStats span{font-size:9px;color:#7c8580}.examGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.examCard{background:#fff;border:1px solid #e2e7e1;border-radius:13px;padding:14px;display:grid;gap:8px}.examCard span{font-size:11px;color:#36443d;line-height:1.8}.examCard strong{font-size:9px;color:#8b948f}.examCard button,.scenarioCard button{background:#143f36;color:#fff;border-radius:9px;padding:9px 11px;font-size:10px}.finalExam{border-color:#cdb77e;background:#fcfaf3}.scenarioCard{margin-top:15px;background:#143f36;color:#fff;border-radius:16px;padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:18px}.scenarioCard h3{margin:7px 0;font-size:16px}.scenarioCard p{font-size:11px;line-height:1.9;color:#d5e0da}.scenarioAnswer{background:#ffffff12;border:1px solid #ffffff18;border-radius:11px;padding:13px}.examOverlay{position:fixed;inset:0;background:#0e211dcc;z-index:60;padding:18px;overflow:auto}.examModal{background:#fff;width:min(760px,100%);margin:0 auto;border-radius:18px;padding:25px;position:relative}.examModal h2{margin:7px 0}.finalQuestion{padding:13px 0;border-bottom:1px solid #e8ece7}.finalQuestion>b{display:block;font-size:11px;line-height:1.9}.finalQuestion label{display:flex;gap:8px;margin-top:7px;padding:8px;border:1px solid #e5e9e4;border-radius:8px;font-size:10px;line-height:1.8}.finalQuestion input{margin-top:4px;accent-color:#173f36}.finalQuestion small{display:block;margin-top:7px;color:#68736c;font-size:9px;line-height:1.8}@media(max-width:760px){.extraHead{display:block}.extraHead button{margin-top:10px}.extraStats{grid-template-columns:repeat(2,1fr)}.examGrid{grid-template-columns:1fr}.scenarioCard{grid-template-columns:1fr}.examModal{padding:18px}}
CSS
      - name: Build and commit
        run: |
          npm install
          npm run build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.jsx src/styles.css
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'feat: add module exams final exam dashboard and scenarios'; git push; fi

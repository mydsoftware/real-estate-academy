name: Apply Final Academy

on:
  push:
    paths:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python scripts/finalize.py
      - run: npm install
      - run: npm run build
      - name: Commit final implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.jsx src/styles.css
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'feat: finalize academy quizzes exams dashboard and scenarios'; git push; fi
